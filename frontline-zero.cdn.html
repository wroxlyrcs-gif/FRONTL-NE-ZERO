function ctfStep(dt){for(const f of FL){if(f.car){if(!f.car.alive){f.x=f.car.x;f.z=f.car.z;f.y=f.car.y;f.car.carry=null;f.car=null;f.dt=NOW}else{f.x=f.car.x;f.z=f.car.z;f.y=f.car.y}}

function modeRes(){const m=G.mode,tm=(a,b)=>a==b?-1:a>b?0:1;let w,t,s;

 if(t===undefined)t=w<0?L('draw'):L('wins',L(w?'tn1':'tn0'));return{w,t,s}}

 $('hud').style.display='none';$('tc').style.display='none';$('res').style.display='flex';$('res').style.background=w==1?'radial-gradient(#7a0a0acc,#000d)':'radial-gradient(#0a3a9acc,#000d)';
 $('rt').textContent=r.t;$('rt').style.color=w==1?'#ff5050':'#5aa8ff';$('rs2').innerHTML='<h2>'+(w<0?L('draw'):w?L('defeat'):L('victory'))+' — '+r.s+'</h2>';$('rtab').innerHTML=sbHTML();rewards(w);snd(w==0?'win':'lose')}

// ---------- PLAY SETUP SCREEN ----------
const TIMEN=[['Gündüz','Day'],['Gece','Night'],['Gün Batımı','Sunset'],['Şafak','Dawn']];
const MODES=[['tdm',['Takım Ölüm Maçı (3v3)','Team Deathmatch (3v3)'],['İki takım çarpışır; 50 eleme puanına ilk ulaşan kazanır (8 dk).','Two teams fight; first to 50 kills wins (8 min).']],

['dom',['Hakimiyet','Domination'],['3 bölgeyi ele geçir; sahip olunan her bölge 2 saniyede 1 puan verir; 100 puan kazanır.','Capture 3 zones; each owned zone gives 1 point per 2 s; first to 100 wins.']],

['el',['Eleme','Elimination'],['Yeniden doğma yok; ilk 5 tur kazanan.','No respawns; first to win 5 rounds.']]];
let PS={map:0,tod:0,mode:'tdm'};const PVC={};
const hx6=n=>'#'+n.toString(16).padStart(6,'0');
const PV={crate:[2,2,'#8a6a3d'],mach:[5,2.2,'#4a4d52'],barrel:[1,1,'#2a5f8a'],pillar:[1.2,1.2,'#888'],car:[4.4,1.9,'#aa5533'],tent:[3.4,3.4,'#c8602a'],rock:[2.2,2.2,'#70747a'],tower:[4,4,'#666'],bldg:[10,10,'#6a7a8a'],desk:[3,1.2,'#9a9a9a'],glass:[5,.4,'#88ccee'],crane:[12,1.4,'#d9822b'],lamp:[.8,.8,'#ffe9a0'],hang:[1.2,.6,'#ffe9a0'],house:[9,7,'#b08850'],cont:[6,2.4,'#7a4a2e'],wall:[7,1.2,'#8a8e95'],stone:[6,1,'#8a8e95'],fence:[6,.3,'#7a5a30']};
function mapPrev(i,t){const k=i+'_'+t;if(PVC[k])return PVC[k];const M=i?MAPS[i-1]:null,hx=M?M.hx:60,hz=M?M.hz:45,c=document.createElement('canvas');c.width=168;c.height=100;const x=c.getContext('2d'),k2=Math.min(160/(hx*2),92/(hz*2));
 x.fillStyle=M?hx6(M.fl):'#4a4d52';x.fillRect(0,0,168,100);const R2=(cx,cz,w,d,col)=>{x.fillStyle=col;x.fillRect(84+(cx-w/2)*k2,50+(cz-d/2)*k2,w*k2,d*k2)};
 R2(-hx+7,0,14,hz*2,'rgba(40,90,200,.35)');R2(hx-7,0,14,hz*2,'rgba(200,40,40,.35)');
 if(M){if(M.pond){x.fillStyle=hx6(M.pond);x.beginPath();x.arc(84,50,6*k2,0,6.3);x.fill()}
  placeProps(M,(ty,px,pz,s,tt,q)=>{let p=PV[ty]||[2,2,'#999'],w=p[0],d=p[1],col=p[2];if(ty=='house')col=hx6(M.pal[Math.floor(q[0]*M.pal.length)]);if(ty=='bldg')col=hx6(M.pal[Math.floor(q[1]*M.pal.length)]);
  if(ty=='cont'){col=hx6(M.pal[Math.floor(q[0]*M.pal.length)]);if(q[1]>=.5){w=2.4;d=6}}if((ty=='wall'||ty=='stone'||ty=='fence')&&q[0]>=.5){w=p[1];d=p[0]}
  if(ty=='tree'){x.fillStyle='#2f6a3a';x.beginPath();x.arc(84+px*k2,50+pz*k2,2.4*k2,0,6.3);x.fill();return}R2(px,pz,w,d,col)})}
 else{R2(0,0,4,4,'#9a9a9a');R2(0,-26,22,10,'#7a7e84');[[18,10],[-18,-10],[18,-10],[-18,10]].forEach(p=>R2(p[0],p[1],10,3,'#3d5a6c'))}
 x.fillStyle=['rgba(0,0,0,0)','rgba(5,10,40,.55)','rgba(255,120,40,.28)','rgba(150,160,255,.24)'][t];x.fillRect(0,0,168,100);return PVC[k]=c.toDataURL()}
function buildPS(){const T=S.lang=='tr'?0:1;
