<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d13">
<title>FRONTLINE: ZERO V2.4</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
button{background:#142638;color:white;border:1px solid #4389c9;border-radius:6px;padding:13px;font-weight:bold}
.screen{position:fixed;inset:0;z-index:10;background:#080d13ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.hidden{display:none!important}
h1{font-size:clamp(35px,8vw,60px);letter-spacing:4px;margin:0}
h1 span{color:#ff3434}
.menuBtn{width:280px;max-width:85vw}
#hud{position:fixed;inset:0;display:none;pointer-events:none}
#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#000b;padding:10px;white-space:nowrap}
#health{position:absolute;bottom:15px;left:12px;background:#000b;padding:10px}
#healthbar{width:130px;height:7px;background:#333;margin-top:5px}
#healthfill{height:100%;background:#39cf77;width:100%}
#ammo{position:absolute;bottom:15px;right:12px;background:#000b;padding:10px}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:0 0 5px black}
#notice{position:absolute;top:22%;width:100%;text-align:center;font-size:22px;text-shadow:0 2px 5px black}
#pause{position:absolute;top:12px;right:12px;pointer-events:auto;width:45px;padding:10px}
#controls{position:fixed;inset:0;display:none;pointer-events:none}
#look{position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto}
#stick{position:absolute;left:20px;bottom:25px;width:115px;height:115px;border:2px solid #ffffff88;border-radius:50%;background:#ffffff15;pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#ffffffaa}
.ctrl{position:absolute;width:65px;height:65px;border-radius:50%;background:#07111ddd;border:2px solid #ffffff99;color:white;font-size:20px;pointer-events:auto}
#fire{right:20px;bottom:100px;background:#9b2020dd;width:75px;height:75px}
#aim{right:105px;bottom:25px}
#jump{right:105px;bottom:105px}
#reload{right:20px;bottom:20px}
#sprint{left:145px;bottom:35px;width:55px;height:55px;font-size:13px}
#err{position:fixed;z-index:30;top:0;background:#900;color:white;padding:10px;display:none}
</style>
</head>

<body>

<div id="menu" class="screen">
<h1>FRONTLINE:<br><span>ZERO</span></h1>
<p>TACTICAL 3D FPS</p>
<button class="menuBtn" onclick="startGame('tdm')">TEAM DEATHMATCH</button>
<button class="menuBtn" onclick="startGame('elim')">ELIMINATION</button>
<button class="menuBtn" onclick="startGame('training')">TRAINING</button>
<p style="color:#9baab8;font-size:12px">MOBILE FPS PROTOTYPE V2.4</p>
</div>

<div id="hud">
<div id="score">MAVİ 0 - 0 KIRMIZI | 08:00</div>
<div id="health">CAN: <span id="hp">100</span><div id="healthbar"><div id="healthfill"></div></div></div>
<div id="ammo">MERMİ<br><b id="bullets">30</b> / 30</div>
<div id="cross">+</div>
<div id="notice"></div>
<button id="pause" onclick="pauseGame()">Ⅱ</button>
</div>

<div id="controls">
<div id="look"></div>
<div id="stick"><div id="knob"></div></div>
<button class="ctrl" id="fire">●</button>
<button class="ctrl" id="aim">◎</button>
<button class="ctrl" id="jump">▲</button>
<button class="ctrl" id="reload">↻</button>
<button class="ctrl" id="sprint">RUN</button>
</div>

<div id="pauseScreen" class="screen hidden">
<h1>PAUSED</h1>
<button class="menuBtn" onclick="resumeGame()">RESUME</button>
<button class="menuBtn" onclick="backMenu()">MAIN MENU</button>
</div>

<div id="result" class="screen hidden">
<h1 id="resultTitle">MATCH OVER</h1>
<p id="resultText"></p>
<button class="menuBtn" onclick="startGame(mode)">PLAY AGAIN</button>
<button class="menuBtn" onclick="backMenu()">MAIN MENU</button>
</div>

<div id="err"></div>

<script src="three.min.js"></script>

<script>
'use strict';

const $=id=>document.getElementById(id);

let scene,camera,renderer,player,clock;
let bots=[],obstacles=[],keys={};
let weapon,muzzleLight;

let running=false,paused=false,mode='tdm';
let blue=0,red=0,hp=100,ammo=30,time=480;

let yaw=0,pitch=0,moveX=0,moveY=0;
let velocityY=0,onGround=true;

let cooldown=0,reloadTimer=0,reloading=false;
let noticeTimer=0;

let stickPointer=null,lookPointer=null;
let aiming=false,sprinting=false;
let recoil=0,muzzleTimer=0;
let frameId=null;
let gameGeneration=0;

const raycaster=new THREE.Raycaster();

function mat(color,roughness=.85,metalness=0){
 return new THREE.MeshStandardMaterial({
  color,roughness,metalness
 });
}

window.onerror=function(message){
 $('err').style.display='block';
 $('err').textContent=String(message);
};

function startGame(m){

 if(typeof THREE==='undefined'){
  $('err').style.display='block';
  $('err').textContent='three.min.js bulunamadı. www klasörüne ekleyin.';
  return;
 }

 gameGeneration++;
 const generation=gameGeneration;

 if(frameId!==null){
  cancelAnimationFrame(frameId);
  frameId=null;
 }

 mode=m;

 $('menu').classList.add('hidden');
 $('pauseScreen').classList.add('hidden');
 $('result').classList.add('hidden');

 $('hud').style.display='block';
 $('controls').style.display='block';

 reset();
 createWorld();

 clock=new THREE.Clock();

 running=true;
 paused=false;

 clock.start();
 animate(generation);
}

function reset(){

 blue=0;red=0;hp=100;ammo=30;
 time=mode==='training'?999:480;

 yaw=0;pitch=0;
 moveX=0;moveY=0;
 velocityY=0;onGround=true;

 cooldown=0;
 reloadTimer=0;
 reloading=false;

 aiming=false;
 sprinting=false;

 recoil=0;
 muzzleTimer=0;
 noticeTimer=0;

 $('notice').textContent='';
 $('aim').style.background='#07111ddd';

 updateHUD();
}

function createWorld(){

 if(renderer){
  renderer.dispose();
  renderer.domElement.remove();
 }

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8999a5);
 scene.fog=new THREE.Fog(0x8999a5,45,125);

 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,.1,200
 );

 renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
 });

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

 if('outputColorSpace' in renderer){
  renderer.outputColorSpace=THREE.SRGBColorSpace;
 }

 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(
  0xffffff,0x39434d,2
 ));

 const sun=new THREE.DirectionalLight(0xffffff,1.8);
 sun.position.set(15,30,10);
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(110,110),
  mat(0x48545a)
 );

 ground.rotation.x=-Math.PI/2;
 scene.add(ground);

 createArena();
 createPlayer();
 createBots();
}

/* ===========================
   V2.3 REALISTIC MILITARY MAP
=========================== */

function createArena(){

 obstacles=[];

 const materials={
  concrete:mat(0x535d62),
  dark:mat(0x29343a),
  metal:mat(0x394a55,.5,.4),
  container:mat(0x315c59),
  glass:mat(0x172c38,.3,.4),
  sand:mat(0x777365),
  wood:mat(0x554638)
 };

 function block(x,y,z,w,h,d,material,collision=true){

  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   material
  );

  mesh.position.set(x,y,z);
  scene.add(mesh);

  if(collision){
   obstacles.push({
    x,z,hx:w/2,hz:d/2
   });
  }

  return mesh;
 }

 function building(x,z,w,d,h){

  block(x,h/2,z,w,h,d,materials.concrete);

  block(
   x,h+.15,z,w+.4,.3,d+.4,
   materials.dark,false
  );

  for(let i=-1;i<=1;i++){

   const win=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.2,.12),
    materials.glass
   );

   win.position.set(
    x+i*w*.27,
    h*.65,
    z+d/2+.07
   );

   scene.add(win);
  }

  block(
   x,h*.3,z+d/2+.09,
   1.3,h*.6,.15,
   materials.dark,false
  );

  block(
   x,h+.55,z,
   w*.35,.5,d*.3,
   materials.metal,false
  );
 }

 function container(x,z,rotation=0){

  const obj=block(
   x,1.3,z,7,2.6,2.6,
   materials.container
  );

  obj.rotation.y=rotation;

  const roof=block(
   x,2.65,z,7.1,.12,2.7,
   materials.dark,false
  );

  roof.rotation.y=rotation;
 }

 // Boundary walls
 block(0,3,-48,100,6,2,materials.dark);
 block(0,3,48,100,6,2,materials.dark);
 block(-48,3,0,2,6,100,materials.dark);
 block(48,3,0,2,6,100,materials.dark);

 // Military buildings
 building(-21,-16,12,9,5);
 building(21,-16,12,9,5);
 building(-23,14,10,9,4);
 building(23,14,10,9,4);

 // Containers
 container(-11,-5);
 container(11,-5);
 container(-12,8,Math.PI/2);
 container(12,8,Math.PI/2);

 // Concrete cover
 block(-7,1,0,5,2,2,materials.concrete);
 block(7,1,0,5,2,2,materials.concrete);

 block(-18,1,2,4,2,2,materials.sand);
 block(18,1,2,4,2,2,materials.sand);

 // Barricades
 for(let i=0;i<6;i++){

  const x=-25+i*10;

  block(
   x,.65,-31,
   3,1.3,1.2,
   materials.sand
  );

  block(
   x,.65,31,
   3,1.3,1.2,
   materials.sand
  );
 }

 // Military crates
 for(let i=0;i<8;i++){

  const x=(Math.random()-.5)*55;
  const z=(Math.random()-.5)*45;

  if(Math.abs(x)<9&&Math.abs(z)<10)continue;

  block(
   x,.65,z,
   1.3,1.3,1.3,
   materials.wood
  );
 }

 // Lighting poles
 for(let i=-1;i<=1;i+=2){

  const pole=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,.18,8,8),
   materials.dark
  );

  pole.position.set(i*35,4,-5);
  scene.add(pole);

  const lamp=new THREE.PointLight(
   0xffd99a,1.2,18
  );

  lamp.position.set(i*35,8,-5);
  scene.add(lamp);
 }

 // Team spawn markers
 createMarker(0,35,0x2277ff);
 createMarker(0,-35,0xff3333);

 // Ground details
 const details=new THREE.Group();

 for(let i=0;i<35;i++){

  const rock=new THREE.Mesh(
   new THREE.DodecahedronGeometry(
    .2+Math.random()*.35,0
   ),
   materials.sand
  );

  rock.position.set(
   (Math.random()-.5)*85,
   .12,
   (Math.random()-.5)*85
  );

  details.add(rock);
 }

 scene.add(details);
}

function createMarker(x,z,color){

 const marker=new THREE.Mesh(
  new THREE.CircleGeometry(5,24),
  new THREE.MeshBasicMaterial({
   color,transparent:true,opacity:.15
  })
 );

 marker.rotation.x=-Math.PI/2;
 marker.position.set(x,.03,z);
 scene.add(marker);
}

/* ===========================
   PLAYER AND WEAPON
=========================== */

function createPlayer(){

 player=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.5,.5),
  mat(0x287dcc)
 );

 body.position.y=.9;
 player.add(body);

 player.position.set(0,0,30);
 scene.add(player);

 camera.position.set(0,1.6,0);
 camera.rotation.order='YXZ';
 player.add(camera);

 createWeapon();
}

function createWeapon(){

 weapon=new THREE.Group();

 const dark=mat(0x20272c);
 const metal=mat(0x48545c,.45,.5);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.16,.19,.65),
  dark
 );

 body.position.set(.32,-.27,-.48);
 weapon.add(body);

 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,.48,8),
  metal
 );

 barrel.rotation.x=Math.PI/2;
 barrel.position.set(.32,-.25,-.98);
 weapon.add(barrel);

 const grip=new THREE.Mesh(
  new THREE.BoxGeometry(.12,.27,.15),
  dark
 );

 grip.position.set(.32,-.48,-.34);
 weapon.add(grip);

 const sight=new THREE.Mesh(
  new THREE.BoxGeometry(.08,.07,.12),
  metal
 );

 sight.position.set(.32,-.16,-.5);
 weapon.add(sight);

 camera.add(weapon);

 muzzleLight=new THREE.PointLight(0xffbb55,0,5);
 muzzleLight.position.set(.32,-.25,-1.2);
 camera.add(muzzleLight);
}

/* ===========================
   BOT SYSTEM
=========================== */

function createBots(){

 bots=[];

 for(let i=0;i<5;i++)makeBot('red');

 if(mode!=='training'){
  for(let i=0;i<2;i++)makeBot('blue');
 }
}

function makeBot(team){

 const obj=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.5,.5),
  mat(team==='blue'?0x287dcc:0xd63c3c)
 );

 body.position.y=.9;
 obj.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,10),
  mat(0xc8a58d)
 );

 head.position.y=1.85;
 obj.add(head);

 obj.position.set(
  (Math.random()-.5)*30,
  0,
  team==='red'?-25:20+Math.random()*10
 );

 scene.add(obj);

 const b={
  obj,body,team,
  hp:100,
  alive:true,
  respawn:0,
  cooldown:1+Math.random()*2,
  speed:team==='red'?2.5:2,
  phase:Math.random()*6
 };

 body.userData.bot=b;
 head.userData.bot=b;

 bots.push(b);
}

function blocked(x,z){

 if(Math.abs(x)>45||Math.abs(z)>45)return true;

 return obstacles.some(o=>
  Math.abs(x-o.x)<o.hx+.65&&
  Math.abs(z-o.z)<o.hz+.65
 );
}

function movePlayer(dt){

 const speed=sprinting?12:8;

 const f=new THREE.Vector3(
  Math.sin(yaw),0,-Math.cos(yaw)
 );

 const r=new THREE.Vector3(
  Math.cos(yaw),0,Math.sin(yaw)
 );

 const dx=(f.x*-moveY+r.x*moveX)*speed*dt;
 const dz=(f.z*-moveY+r.z*moveX)*speed*dt;

 if(!blocked(player.position.x+dx,player.position.z)){
  player.position.x+=dx;
 }

 if(!blocked(player.position.x,player.position.z+dz)){
  player.position.z+=dz;
 }

 velocityY-=18*dt;
 player.position.y+=velocityY*dt;

 if(player.position.y<=0){
  player.position.y=0;
  velocityY=0;
  onGround=true;
 }

 player.rotation.y=yaw;

 camera.rotation.set(
  pitch+recoil,0,0,'YXZ'
 );

 recoil=Math.max(0,recoil-dt*2.5);

 cooldown=Math.max(0,cooldown-dt);

 if(muzzleTimer>0){
  muzzleTimer-=dt;
  muzzleLight.intensity=18;
 }else{
  muzzleLight.intensity=0;
 }

 const movement=Math.min(
  Math.abs(moveX)+Math.abs(moveY),1
 );

 weapon.position.y=
  Math.sin(clock.elapsedTime*10)*movement*.012;
}

function nearestEnemy(b){

 const enemies=bots.filter(x=>
  x.team==='red'&&x.alive
 );

 if(!enemies.length)return player.position;

 return enemies.reduce((a,c)=>
  b.obj.position.distanceTo(c.obj.position)<
  b.obj.position.distanceTo(a.obj.position)?c:a
 ).obj.position;
}

function updateBots(dt){

 bots.forEach(b=>{

  if(!b.alive){

   if(mode==='elim')return;

   b.respawn-=dt;

   if(b.respawn<=0){

    b.hp=100;
    b.alive=true;
    b.obj.visible=true;

    b.obj.position.set(
     (Math.random()-.5)*30,
     0,
     b.team==='red'?-30:25
    );
   }

   return;
  }

  b.phase+=dt;
  b.cooldown-=dt;

  const target=b.team==='red'?
   player.position:nearestEnemy(b);

  if(!target)return;

  const dx=target.x-b.obj.position.x;
  const dz=target.z-b.obj.position.z;
  const dist=Math.hypot(dx,dz);

  if(dist>7){

   const nx=b.obj.position.x+
    dx/dist*b.speed*dt;

   const nz=b.obj.position.z+
    dz/dist*b.speed*dt;

   if(!blocked(nx,nz)){
    b.obj.position.x=nx;
    b.obj.position.z=nz;
   }
  }

  b.obj.position.y=Math.sin(b.phase*3)*.025;

  b.obj.lookAt(
   target.x,b.obj.position.y,target.z
  );

  if(b.team==='red'&&dist<22&&b.cooldown<=0){

   b.cooldown=2.5;
   damagePlayer(5);
  }

  if(b.team==='blue'&&dist<20&&b.cooldown<=0){

   b.cooldown=2.5;

   const enemy=bots.find(x=>
    x.team==='red'&&x.alive
   );

   if(enemy)damageBot(enemy,25);
  }
 });
}

/* ===========================
   COMBAT SYSTEM
=========================== */

function shoot(){

 if(!running||paused||reloading||
    ammo<=0||cooldown>0)return;

 ammo--;
 cooldown=.22;

 recoil=.035;
 muzzleTimer=.07;

 $('cross').style.transform=
  'translate(-50%,-50%) scale(1.5)';

 setTimeout(()=>{
  $('cross').style.transform=
   'translate(-50%,-50%) scale(1)';
 },80);

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),camera
 );

 const targets=bots
  .filter(b=>b.alive&&b.team==='red')
  .flatMap(b=>[b.body,b.obj.children[1]]);

 const hits=raycaster.intersectObjects(targets,false);

 if(hits.length){

  const b=hits[0].object.userData.bot;

  if(b)damageBot(b,50);

  showNotice('HIT!');
 }

 updateHUD();
}

function damageBot(b,n){

 if(!b.alive)return;

 b.hp-=n;

 if(b.hp<=0){

  b.hp=0;
  b.alive=false;
  b.obj.visible=false;
  b.respawn=5;

  if(b.team==='red')blue++;
  else red++;

  showNotice('ELIMINATED');

  if(mode==='elim')checkElimination();

  if(mode==='tdm'&&(blue>=50||red>=50)){
   endGame(blue>red);
  }
 }
}

function damagePlayer(n){

 if(mode==='training'||!running)return;

 hp=Math.max(0,hp-n);

 if(hp===0){

  if(mode==='elim'){

   const allies=bots.filter(b=>
    b.team==='blue'&&b.alive
   );

   if(allies.length===0){
    endGame(false);
   }else{
    hp=100;
    player.position.set(0,0,30);
    showNotice('RESPAWN');
   }

  }else{

   hp=100;
   player.position.set(0,0,30);
   showNotice('RESPAWN');
  }
 }

 updateHUD();
}

function checkElimination(){

 if(mode!=='elim')return;

 const enemies=bots.filter(b=>
  b.team==='red'&&b.alive
 );

 const allies=bots.filter(b=>
  b.team==='blue'&&b.alive
 );

 if(enemies.length===0)endGame(true);
 else if(hp<=0&&allies.length===0)endGame(false);
}

function reload(){

 if(!running||paused||reloading||ammo===30)return;

 reloading=true;
 reloadTimer=1.3;

 showNotice('RELOADING...');
}

function updateReload(dt){

 if(!reloading)return;

 reloadTimer-=dt;

 if(reloadTimer<=0){

  ammo=30;
  reloading=false;

  showNotice('RELOADED');
  updateHUD();
 }
}

function jump(){

 if(running&&!paused&&onGround){

  velocityY=7;
  onGround=false;
 }
}

/* ===========================
   HUD AND GAME LOOP
=========================== */

function showNotice(t){

 $('notice').textContent=t;
 noticeTimer=1.2;
}

function updateTimer(dt){

 if(mode==='training')return;

 time=Math.max(0,time-dt);

 if(mode==='elim')checkElimination();

 if(time<=0&&mode==='tdm'){
  endGame(blue>=red);
 }
}

function updateHUD(){

 $('hp').textContent=hp;
 $('bullets').textContent=ammo;
 $('healthfill').style.width=hp+'%';

 const m=Math.floor(time/60);
 const s=Math.floor(time%60);

 $('score').textContent=
  `MAVİ ${blue} - ${red} KIRMIZI | `+
  `${String(m).padStart(2,'0')}:`+
  `${String(s).padStart(2,'0')}`;
}

function animate(generation){

 if(!running||paused||generation!==gameGeneration)return;

 frameId=requestAnimationFrame(()=>{
  animate(generation);
 });

 const dt=Math.min(clock.getDelta(),.04);

 movePlayer(dt);
 updateBots(dt);
 updateReload(dt);
 updateTimer(dt);
 updateHUD();

 if(noticeTimer>0){

  noticeTimer-=dt;

  if(noticeTimer<=0){
   $('notice').textContent='';
  }
 }

 renderer.render(scene,camera);
}

/* ===========================
   MENU AND PAUSE
=========================== */

function pauseGame(){

 if(!running)return;

 paused=true;

 $('pauseScreen').classList.remove('hidden');
}

function resumeGame(){

 if(!running)return;

 paused=false;

 $('pauseScreen').classList.add('hidden');

 clock.start();
 animate(gameGeneration);
}

function endGame(win){

 if(!running)return;

 running=false;
 paused=false;

 if(frameId!==null){
  cancelAnimationFrame(frameId);
  frameId=null;
 }

 $('hud').style.display='none';
 $('controls').style.display='none';

 $('result').classList.remove('hidden');

 $('resultTitle').textContent=
  win?'VICTORY':'DEFEAT';

 $('resultText').textContent=
  `MAVİ ${blue} - ${red} KIRMIZI`;
}

function backMenu(){

 gameGeneration++;

 running=false;
 paused=false;

 if(frameId!==null){
