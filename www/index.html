<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRONTLINE: ZERO</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d13;color:white;font-family:Arial,sans-serif}
canvas{display:block}
.screen{position:fixed;inset:0;background:#080d13ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
h1{font-size:48px;letter-spacing:5px;margin:0;text-align:center}
h1 span{color:#ff3434}
button{background:#182738;color:white;border:1px solid #4389c9;padding:13px 25px;width:260px;font-size:15px;font-weight:bold;letter-spacing:2px;border-radius:5px}
button:active{background:#2875ae}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#000a;padding:10px 20px;font-size:20px}
#health{position:absolute;bottom:20px;left:15px;background:#000a;padding:12px}
#ammo{position:absolute;bottom:20px;right:15px;background:#000a;padding:12px}
#cross{position:absolute;top:50%;left:50%;font-size:25px;transform:translate(-50%,-50%)}
#controls{position:fixed;inset:0;display:none;pointer-events:none}
.control{position:absolute;pointer-events:auto;border:2px solid #ffffff88;background:#0008;color:white;border-radius:50%;width:65px;height:65px;font-size:20px;touch-action:none}
#fire{right:30px;bottom:90px}
#jump{right:110px;bottom:25px}
#reload{right:30px;bottom:20px}
#stick{position:absolute;left:25px;bottom:35px;width:115px;height:115px;border:2px solid #ffffff77;border-radius:50%;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:#ffffff99}
#look{position:absolute;right:0;top:0;width:65%;height:100%;pointer-events:auto;touch-action:none}
#pause{position:absolute;top:12px;right:12px;width:48px;padding:10px;pointer-events:auto}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>

<div id="menu" class="screen">
<h1>FRONTLINE:<br><span>ZERO</span></h1>
<p>3D TACTICAL ARENA</p>
<button onclick="startGame('tdm')">TEAM DEATHMATCH</button>
<button onclick="startGame('elim')">ELIMINATION</button>
<button onclick="training()">ANTRENMAN</button>
<p class="small">V1 • ANDROID / WEB</p>
</div>

<div id="hud">
<div id="score">MAVİ 0 - 0 KIRMIZI | <span id="timer">08:00</span></div>
<div id="health">CAN: <span id="hp">100</span></div>
<div id="ammo">MERMİ: <span id="bullets">30</span>/30</div>
<div id="cross">+</div>
<button id="pause" onclick="pauseGame()">Ⅱ</button>
</div>

<div id="controls">
<div id="look"></div>
<div id="stick"><div id="knob"></div></div>
<button class="control" id="fire">●</button>
<button class="control" id="jump">▲</button>
<button class="control" id="reload">↻</button>
</div>

<div id="pauseScreen" class="screen hidden">
<h1>OYUN DURAKLATILDI</h1>
<button onclick="resumeGame()">DEVAM ET</button>
<button onclick="backMenu()">ANA MENÜ</button>
</div>

<div id="result" class="screen hidden">
<h1 id="resultTitle">MAÇ BİTTİ</h1>
<p id="resultText"></p>
<button onclick="backMenu()">ANA MENÜ</button>
<button onclick="startGame(mode)">TEKRAR OYNA</button>
</div>

<script src="three.min.js"></script>
<script>
let scene,camera,renderer,player;
let bots=[],keys={},bullets=30,hp=100;
let blue=0,red=0,time=480;
let running=false,paused=false,mode='tdm';
let moveX=0,moveY=0,lookX=0,lookY=0;
let yaw=0,pitch=0,reloading=false;
let clock=new THREE.Clock();

function startGame(m){
 mode=m;
 document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));
 $('hud').style.display='block';
 $('controls').style.display='block';
 $('menu').classList.add('hidden');
 $('pauseScreen').classList.add('hidden');
 $('result').classList.add('hidden');
 initWorld();
 running=true;paused=false;
 hp=100;bullets=30;blue=0;red=0;time=480;
 updateHUD();
 clock.start();
 animate();
}

function $(id){return document.getElementById(id)}

function initWorld(){
 if(renderer){renderer.dispose();$('hud').style.display='none'}
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8799a8);
 scene.fog=new THREE.Fog(0x8799a8,25,100);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x354050,2));
 let light=new THREE.DirectionalLight(0xffffff,2);
 light.position.set(10,20,10);scene.add(light);
 let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x4b5555}));
 ground.rotation.x=-Math.PI/2;scene.add(ground);
 for(let i=0;i<30;i++){
  let x=(Math.random()-.5)*75,z=(Math.random()-.5)*75;
  let box=new THREE.Mesh(new THREE.BoxGeometry(3,2+Math.random()*3,3),new THREE.MeshStandardMaterial({color:0x68747a}));
  box.position.set(x,box.geometry.parameters.height/2,z);scene.add(box);
 }
 player=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.5,.5),new THREE.MeshStandardMaterial({color:0x277dce}));
 body.position.y=.9;player.add(body);
 player.position.set(0,0,15);scene.add(player);
 camera.position.set(0,1.6,0);player.add(camera);
 bots=[];
 for(let i=0;i<6;i++)createBot(i);
}

function createBot(i){
 let team=i<3?'blue':'red';
 let bot=new THREE.Group();
 let mat=new THREE.MeshStandardMaterial({color:team==='blue'?0x277dce:0xd73535});
 let body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.5,.5),mat);
 body.position.y=.9;bot.add(body);
 bot.position.set((Math.random()-.5)*35,0,(Math.random()-.5)*35);
 scene.add(bot);
 bots.push({obj:bot,team,hp:100,cool:Math.random()*2});
}

function animate(){
 if(!running||paused)return;
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.05);
 updatePlayer(dt);
 updateBots(dt);
 renderer.render(scene,camera);
}

function updatePlayer(dt){
 let speed=8;
 let forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
 let right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
 player.position.addScaledVector(forward,-moveY*speed*dt);
 player.position.addScaledVector(right,moveX*speed*dt);
 player.rotation.y=yaw;
 camera.rotation.order='YXZ';
 camera.rotation.y=0;
 camera.rotation.x=pitch;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);
}

function updateBots(dt){
 bots.forEach(b=>{
  if(b.hp<=0)return;
  let dir=new THREE.Vector3().subVectors(player.position,b.obj.position);
  let distance=dir.length();
  if(distance>5){
   dir.normalize();b.obj.position.addScaledVector(dir,dt*(mode==='training'?0:2));
   b.obj.lookAt(player.position);
  }
  b.cool-=dt;
  if(distance<22&&b.cool<=0&&mode!=='training'){
   b.cool=2+Math.random()*2;
   hp=Math.max(0,hp-5);
   updateHUD();
   if(hp<=0)endGame(false);
  }
 });
}

function shoot(){
 if(!running||paused||bullets<=0)return;
 bullets--;
 let target=null,best=100;
 bots.forEach(b=>{
  if(b.hp<=0)return;
  let p=b.obj.position.clone().add(new THREE.Vector3(0,1,0)).project(camera);
  let d=Math.hypot(p.x,p.y);
  if(p.z>0&&d<.12&&d<best){best=d;target=b}
 });
 if(target){
  target.hp-=50;
  if(target.hp<=0){
   target.obj.visible=false;
   if(target.team==='red')blue++;else red++;
   if(blue>=50||red>=50)endGame(blue>red);
  }
 }
 updateHUD();
}
function reload(){
 if(reloading||bullets===30)return;
 reloading=true;
 setTimeout(()=>{bullets=30;reloading=false;updateHUD()},1300);
}
function updateHUD(){
 $('hp').textContent=hp;
 $('bullets').textContent=bullets;
 $('score').innerHTML=`MAVİ ${blue} - ${red} KIRMIZI | <span id="timer">${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</span>`;
}

function pauseGame(){
 if(!running)return;
 paused=true;$('pauseScreen').classList.remove('hidden');
}
function resumeGame(){
 paused=false;$('pauseScreen').classList.add('hidden');
 clock.start();animate();
}
function backMenu(){
 running=false;
 $('hud').style.display='none';$('controls').style.display='none';
 $('menu').classList.remove('hidden');
 $('pauseScreen').classList.add('hidden');
 $('result').classList.add('hidden');
}
function endGame(win){
 running=false;
 $('hud').style.display='none';$('controls').style.display='none';
 $('result').classList.remove('hidden');
 $('resultTitle').textContent=win?'ZAFER':'MAĞLUBİYET';
 $('resultText').textContent=`Mavi ${blue} - Kırmızı ${red}`;
}
function training(){startGame('training')}

document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function inputUpdate(){
 moveX=(keys.d?1:0)-(keys.a?1:0);
 moveY=(keys.w?1:0)-(keys.s?1:0);
}
setInterval(inputUpdate,30);

$('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()});
$('fire').addEventListener('click',shoot);
$('reload').addEventListener('click',reload);
$('reload').addEventListener('touchstart',e=>{e.preventDefault();reload()});
$('jump').addEventListener('click',()=>{if(player)player.position.y+=.3});
$('stick').addEventListener('touchmove',e=>{
 let r=$('stick').getBoundingClientRect(),t=e.touches[0];
 let x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2;
 moveX=THREE.MathUtils.clamp(x/45,-1,1);
 moveY=THREE.MathUtils.clamp(y/45,-1,1);
 $('knob').style.transform=`translate(${moveX*35}px,${moveY*35}px)`;
});
$('stick').addEventListener('touchend',()=>{moveX=moveY=0;$('knob').style.transform=''});
$('look').addEventListener('touchmove',e=>{
 let t=e.touches[0];
 if(lookX){yaw-=(t.clientX-lookX)*.005;pitch=THREE.MathUtils.clamp(pitch+(t.clientY-lookY)*.005,-1.2,1.2)}
 lookX=t.clientX;lookY=t.clientY;
});
$('look').addEventListener('touchend',()=>lookX=lookY=0);
$('look').addEventListener('mousedown',e=>{lookX=e.clientX;lookY=e.clientY});
$('look').addEventListener('mousemove',e=>{
 if(e.buttons){yaw-=(e.clientX-lookX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lookY)*.005,-1.2,1.2)}
 lookX=e.clientX;lookY=e.clientY;
});
addEventListener('resize',()=>{
 if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
});
setInterval(()=>{
 if(running&&!paused){
  time=Math.max(0,time-1);updateHUD();
  if(time===0)endGame(blue>red);
 }
},1000);
</script>
</body>
</html>
