<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d13">
<title>FRONTLINE: ZERO V2.2</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#080d13;color:white;font-family:Arial;
 touch-action:none
}
canvas{display:block}
button{
 background:#142638;color:white;border:1px solid #4389c9;
 border-radius:6px;padding:13px;font-weight:bold
}
.screen{
 position:fixed;inset:0;z-index:10;background:#080d13ed;
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:12px;text-align:center
}
.hidden{display:none!important}
h1{font-size:clamp(35px,8vw,60px);letter-spacing:4px;margin:0}
h1 span{color:#ff3434}
.menuBtn{width:280px;max-width:85vw}
#hud{position:fixed;inset:0;display:none;pointer-events:none}
#score{
 position:absolute;top:12px;left:50%;transform:translateX(-50%);
 background:#000b;padding:10px;white-space:nowrap
}
#health{position:absolute;bottom:15px;left:12px;background:#000b;padding:10px}
#healthbar{width:130px;height:7px;background:#333;margin-top:5px}
#healthfill{height:100%;background:#39cf77;width:100%}
#ammo{position:absolute;bottom:15px;right:12px;background:#000b;padding:10px}
#cross{
 position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 font-size:25px;transition:transform .1s
}
#notice{
 position:absolute;top:22%;width:100%;text-align:center;
 font-size:22px;text-shadow:0 2px 5px black
}
#pause{position:absolute;top:12px;right:12px;pointer-events:auto;width:45px;padding:10px}
#controls{position:fixed;inset:0;display:none;pointer-events:none}
#look{
 position:absolute;right:0;top:0;width:60%;height:100%;pointer-events:auto
}
#stick{
 position:absolute;left:20px;bottom:25px;width:115px;height:115px;
 border:2px solid #ffffff88;border-radius:50%;
 background:#ffffff15;pointer-events:auto
}
#knob{
 position:absolute;left:35px;top:35px;width:42px;height:42px;
 border-radius:50%;background:#ffffffaa
}
.ctrl{
 position:absolute;width:65px;height:65px;border-radius:50%;
 background:#07111ddd;border:2px solid #ffffff99;color:white;
 font-size:20px;pointer-events:auto
}
#fire{right:20px;bottom:100px;background:#9b2020dd;width:75px;height:75px}
#aim{right:105px;bottom:25px}
#jump{right:105px;bottom:105px}
#reload{right:20px;bottom:20px}
#sprint{left:145px;bottom:35px;width:55px;height:55px;font-size:15px}
#err{
 position:fixed;z-index:30;top:0;background:#900;
 color:white;padding:10px;display:none
}
</style>
</head>

<body>

<div id="menu" class="screen">
<h1>FRONTLINE:<br><span>ZERO</span></h1>
<p>TACTICAL 3D FPS</p>
<button class="menuBtn" onclick="startGame('tdm')">TEAM DEATHMATCH</button>
<button class="menuBtn" onclick="startGame('elim')">ELIMINATION</button>
<button class="menuBtn" onclick="startGame('training')">TRAINING</button>
<p style="color:#9baab8;font-size:12px">MOBILE FPS PROTOTYPE V2.2</p>
</div>

<div id="hud">
<div id="score">MAVİ 0 - 0 KIRMIZI | 08:00</div>

<div id="health">
CAN: <span id="hp">100</span>
<div id="healthbar"><div id="healthfill"></div></div>
</div>

<div id="ammo">MERMİ<br><b id="bullets">30</b> / 30</div>
<div id="cross">+</div>
<div id="notice"></div>
<button id="pause" onclick="pauseGame()">Ⅱ</button>
</div>

<div id="controls">
<div id="look"></div>
<div id="stick"><div id="knob"></div></div>
<button class="ctrl" id="fire">●</button>
<button class="ctrl" id="aim">◎</button>
<button class="ctrl" id="jump">▲</button>
<button class="ctrl" id="reload">↻</button>
<button class="ctrl" id="sprint">RUN</button>
</div>

<div id="pauseScreen" class="screen hidden">
<h1>PAUSED</h1>
<button class="menuBtn" onclick="resumeGame()">RESUME</button>
<button class="menuBtn" onclick="backMenu()">MAIN MENU</button>
</div>

<div id="result" class="screen hidden">
<h1 id="resultTitle">MATCH OVER</h1>
<p id="resultText"></p>
<button class="menuBtn" onclick="startGame(mode)">PLAY AGAIN</button>
<button class="menuBtn" onclick="backMenu()">MAIN MENU</button>
</div>

<div id="err"></div>

<script src="three.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);

let scene,camera,renderer,player,clock;
let bots=[],obstacles=[],keys={};

let running=false,paused=false;
let mode='tdm';

let blue=0,red=0,hp=100,ammo=30,time=480;

let yaw=0,pitch=0;
let moveX=0,moveY=0;
let velocityY=0,onGround=true;

let cooldown=0;
let reloadTimer=0;
let reloading=false;

let noticeTimer=0;
let stickPointer=null;
let lookPointer=null;

let aiming=false;
let sprinting=false;
let roundEnded=false;

let recoil=0;
let muzzleTimer=0;
let muzzleLight=null;
let weapon=null;

const raycaster=new THREE.Raycaster();

function mat(color){
 return new THREE.MeshStandardMaterial({
  color,
  roughness:.85
 });
}

window.onerror=function(m){
 $('err').style.display='block';
 $('err').textContent=String(m);
};

function startGame(m){

 if(typeof THREE==='undefined'){
  $('err').style.display='block';
  $('err').textContent='three.min.js bulunamadı.';
  return;
 }

 mode=m;

 $('menu').classList.add('hidden');
 $('pauseScreen').classList.add('hidden');
 $('result').classList.add('hidden');

 $('hud').style.display='block';
 $('controls').style.display='block';

 reset();
 createWorld();

 clock=new THREE.Clock();

 running=true;
 paused=false;

 clock.start();
 animate();
}

function reset(){

 blue=0;
 red=0;
 hp=100;
 ammo=30;

 time=mode==='training'?999:480;

 yaw=0;
 pitch=0;

 moveX=0;
 moveY=0;

 velocityY=0;
 onGround=true;

 cooldown=0;
 reloadTimer=0;
 reloading=false;

 roundEnded=false;
 aiming=false;
 sprinting=false;

 recoil=0;
 muzzleTimer=0;

 $('aim').style.background='#07111ddd';

 updateHUD();
}

function createWorld(){

 if(renderer){
  renderer.dispose();
  renderer.domElement.remove();
 }

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x8999a5);
 scene.fog=new THREE.Fog(0x8999a5,40,120);

 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,.1,200
 );

 renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:'high-performance'
 });

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(
  0xffffff,0x39434d,2
 ));

 const sun=new THREE.DirectionalLight(0xffffff,1.8);
 sun.position.set(15,30,10);
 scene.add(sun);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(110,110),
  mat(0x48545a)
 );

 ground.rotation.x=-Math.PI/2;
 scene.add(ground);

 createArena();
 createPlayer();
 createBots();
}

function createArena(){

 obstacles=[];

 const walls=[
  [0,3,-48,100,6,2],
  [0,3,48,100,6,2],
  [-48,3,0,2,6,100],
  [48,3,0,2,6,100]
 ];

 walls.forEach(w=>{

  const m=new THREE.Mesh(
   new THREE.BoxGeometry(w[3],w[4],w[5]),
   mat(0x46535c)
  );

  m.position.set(w[0],w[1],w[2]);
  scene.add(m);
 });

 for(let i=0;i<24;i++){

  const x=(Math.random()-.5)*70;
  const z=(Math.random()-.5)*70;

  if(Math.abs(x)<7&&Math.abs(z)<12)continue;

  const w=2+Math.random()*2.5;
  const h=1.5+Math.random()*2;
  const d=2+Math.random()*2.5;

  const box=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   mat(0x59666c)
  );

  box.position.set(x,h/2,z);
  scene.add(box);

  obstacles.push({
   x,z,hx:w/2,hz:d/2
  });
 }

 createMarker(0,35,0x2277ff);
 createMarker(0,-35,0xff3333);
}

function createMarker(x,z,color){

 const marker=new THREE.Mesh(
  new THREE.CircleGeometry(5,24),
  new THREE.MeshBasicMaterial({
   color,
   transparent:true,
   opacity:.15
  })
 );

 marker.rotation.x=-Math.PI/2;
 marker.position.set(x,.03,z);
 scene.add(marker);
}

function createPlayer(){

 player=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.5,.5),
  mat(0x287dcc)
 );

 body.position.y=.9;
 player.add(body);

 player.position.set(0,0,30);
 scene.add(player);

 camera.position.set(0,1.6,0);
 camera.rotation.order='YXZ';

 player.add(camera);

 createWeapon();
}

function createWeapon(){

 weapon=new THREE.Group();

 const dark=mat(0x20272c);
 const metal=mat(0x48545c);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.16,.19,.65),
  dark
 );

 body.position.set(.32,-.27,-.48);
 weapon.add(body);

 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,.48,8),
  metal
 );

 barrel.rotation.x=Math.PI/2;
 barrel.position.set(.32,-.25,-.98);
 weapon.add(barrel);

 const grip=new THREE.Mesh(
  new THREE.BoxGeometry(.12,.27,.15),
  dark
 );

 grip.position.set(.32,-.48,-.34);
 weapon.add(grip);

 const sight=new THREE.Mesh(
  new THREE.BoxGeometry(.08,.07,.12),
  metal
 );

 sight.position.set(.32,-.16,-.5);
 weapon.add(sight);

 camera.add(weapon);

 muzzleLight=new THREE.PointLight(0xffbb55,0,5);
 muzzleLight.position.set(.32,-.25,-1.2);
 camera.add(muzzleLight);
}

function createBots(){

 bots=[];

 for(let i=0;i<5;i++)makeBot('red');

 if(mode!=='training'){
  for(let i=0;i<2;i++)makeBot('blue');
 }
}

function makeBot(team){

 const obj=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.5,.5),
  mat(team==='blue'?0x287dcc:0xd63c3c)
 );

 body.position.y=.9;
 obj.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.25,12,10),
  mat(0xc8a58d)
 );

 head.position.y=1.85;
 obj.add(head);

 obj.position.set(
  (Math.random()-.5)*30,
  0,
  team==='red'?-25:20+Math.random()*10
 );

 scene.add(obj);

 const b={
  obj,body,team,
  hp:100,
  alive:true,
  respawn:0,
  cooldown:1+Math.random()*2,
  speed:team==='red'?2.5:2,
  phase:Math.random()*6
 };

 body.userData.bot=b;
 head.userData.bot=b;

 bots.push(b);
}

function blocked(x,z){

 if(Math.abs(x)>45||Math.abs(z)>45)return true;

 return obstacles.some(o=>
  Math.abs(x-o.x)<o.hx+.65&&
  Math.abs(z-o.z)<o.hz+.65
 );
}

function movePlayer(dt){

 const speed=sprinting?12:8;

 const f=new THREE.Vector3(
  Math.sin(yaw),0,-Math.cos(yaw)
 );

 const r=new THREE.Vector3(
  Math.cos(yaw),0,Math.sin(yaw)
 );

 const dx=(f.x*-moveY+r.x*moveX)*speed*dt;
 const dz=(f.z*-moveY+r.z*moveX)*speed*dt;

 if(!blocked(player.position.x+dx,player.position.z)){
  player.position.x+=dx;
 }

 if(!blocked(player.position.x,player.position.z+dz)){
  player.position.z+=dz;
 }

 velocityY-=18*dt;
 player.position.y+=velocityY*dt;

 if(player.position.y<=0){
  player.position.y=0;
  velocityY=0;
  onGround=true;
 }

 player.rotation.y=yaw;

 camera.rotation.set(
  pitch+recoil,
  0,
  0,
  'YXZ'
 );

 recoil=Math.max(0,recoil-dt*2.5);

 cooldown=Math.max(0,cooldown-dt);

 if(muzzleTimer>0){
  muzzleTimer-=dt;
  muzzleLight.intensity=18;
 }else{
  muzzleLight.intensity=0;
 }

 weapon.position.y=Math.sin(clock.elapsedTime*10)*
  Math.min(Math.abs(moveX)+Math.abs(moveY),1)*.012;
}

function nearestEnemy(b){

 const enemies=bots.filter(x=>
  x.team==='red'&&x.alive
 );

 if(!enemies.length)return player.position;

 return enemies.reduce((a,c)=>
  b.obj.position.distanceTo(c.obj.position)<
  b.obj.position.distanceTo(a.obj.position)?c:a
 ).obj.position;
}

function updateBots(dt){

 bots.forEach(b=>{

  if(!b.alive){

   if(mode==='elim')return;

   b.respawn-=dt;

   if(b.respawn<=0){

    b.hp=100;
    b.alive=true;
    b.obj.visible=true;

    b.obj.position.set(
     (Math.random()-.5)*30,
     0,
     b.team==='red'?-30:25
    );
   }

   return;
  }

  b.phase+=dt;

  b.cooldown-=dt;

  const target=b.team==='red'?
   player.position:nearestEnemy(b);

  if(!target)return;

  const dx=target.x-b.obj.position.x;
  const dz=target.z-b.obj.position.z;

  const dist=Math.hypot(dx,dz);

  if(dist>7){

   const nx=b.obj.position.x+
    dx/dist*b.speed*dt;

   const nz=b.obj.position.z+
    dz/dist*b.speed*dt;

   if(!blocked(nx,nz)){
    b.obj.position.x=nx;
    b.obj.position.z=nz;
   }
  }

  b.obj.position.y=Math.sin(b.phase*3)*.025;

  b.obj.lookAt(
   target.x,
   b.obj.position.y,
   target.z
  );

  if(b.team==='red'&&dist<22&&b.cooldown<=0){

   b.cooldown=2.5;
   damagePlayer(5);
  }

  if(b.team==='blue'&&dist<20&&b.cooldown<=0){

   b.cooldown=2.5;

   const enemy=bots.find(x=>
    x.team==='red'&&x.alive
   );

   if(enemy)damageBot(enemy,25);
  }
 });
}

function shoot(){

 if(!running||paused||reloading||
    ammo<=0||cooldown>0)return;

 ammo--;
 cooldown=.22;

 recoil=.035;
 muzzleTimer=.07;

 $('cross').style.transform=
  'translate(-50%,-50%) scale(1.5)';

 setTimeout(()=>{
  $('cross').style.transform=
   'translate(-50%,-50%) scale(1)';
 },80);

 raycaster.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 const targets=bots
  .filter(b=>b.alive&&b.team==='red')
  .flatMap(b=>[b.body,b.obj.children[1]]);

 const hits=raycaster.intersectObjects(targets,false);

 if(hits.length){

  const b=hits[0].object.userData.bot;

  if(b)damageBot(b,50);

  showNotice('HIT!');
 }

 updateHUD();
}

function damageBot(b,n){

 if(!b.alive)return;

 b.hp-=n;

 if(b.hp<=0){

  b.hp=0;
  b.alive=false;
  b.obj.visible=false;
  b.respawn=5;

  if(b.team==='red')blue++;
  else red++;

  showNotice('ELIMINATED');

  if(mode==='elim')checkElimination();

  if(mode==='tdm'&&(blue>=50||red>=50)){
   endGame(blue>red);
  }
 }
}

function damagePlayer(n){

 if(mode==='training'||!running)return;

 hp=Math.max(0,hp-n);

 if(hp===0){

  if(mode==='elim'){

   const allies=bots.filter(b=>
    b.team==='blue'&&b.alive
   );

   if(allies.length===0){
    endGame(false);
   }else{
    hp=100;
    player.position.set(0,0,30);
    showNotice('RESPAWN');
   }

  }else{

   hp=100;
   player.position.set(0,0,30);
   showNotice('RESPAWN');
  }
 }

 updateHUD();
}

function checkElimination(){

 if(mode!=='elim')return;

 const enemies=bots.filter(b=>
  b.team==='red'&&b.alive
 );

 const allies=bots.filter(b=>
  b.team==='blue'&&b.alive
 );

 if(enemies.length===0)endGame(true);
 else if(hp<=0&&allies.length===0)endGame(false);
}

function reload(){

 if(!running||paused||reloading||ammo===30)return;

 reloading=true;
 reloadTimer=1.3;

 showNotice('RELOADING...');
}

function updateReload(dt){

 if(!reloading)return;

 reloadTimer-=dt;

 if(reloadTimer<=0){

  ammo=30;
  reloading=false;

  showNotice('RELOADED');
  updateHUD();
 }
}

function jump(){

 if(running&&!paused&&onGround){

  velocityY=7;
  onGround=false;
 }
}

function showNotice(t){

 $('notice').textContent=t;
 noticeTimer=1.2;
}

function updateTimer(dt){

 if(mode==='training')return;

 time=Math.max(0,time-dt);

 if(mode==='elim')checkElimination();

 if(time<=0&&mode==='tdm'){
  endGame(blue>=red);
 }
}

function updateHUD(){

 $('hp').textContent=hp;
 $('bullets').textContent=ammo;

 $('healthfill').style.width=hp+'%';

 const m=Math.floor(time/60);
 const s=Math.floor(time%60);

 $('score').textContent=
  `MAVİ ${blue} - ${red} KIRMIZI | `+
  `${String(m).padStart(2,'0')}:`+
  `${String(s).padStart(2,'0')}`;
}

function animate(){

 if(!running||paused)return;

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 movePlayer(dt);
 updateBots(dt);
 updateReload(dt);
 updateTimer(dt);

 updateHUD();

 if(noticeTimer>0){
  noticeTimer-=dt;
  if(noticeTimer<=0)$('notice').textContent='';
 }

 renderer.render(scene,camera);
}

function pauseGame(){

 if(!running)return;

 paused=true;
 $('pauseScreen').classList.remove('hidden');
}

function resumeGame(){

 if(!running)return;

 paused=false;

 $('pauseScreen').classList.add('hidden');

 clock.start();
 animate();
}

function endGame(win){

 if(!running)return;

 running=false;
 paused=false;

 $('hud').style.display='none';
 $('controls').style.display='none';

 $('result').classList.remove('hidden');

 $('resultTitle').textContent=
  win?'VICTORY':'DEFEAT';

 $('resultText').textContent=
  `MAVİ ${blue} - ${red} KIRMIZI`;
}

function backMenu(){

 running=false;
 paused=false;

 $('hud').style.display='none';
 $('controls').style.display='none';

 $('menu').classList.remove('hidden');
 $('pauseScreen').classList.add('hidden');
 $('result').classList.add('hidden');

 if(renderer){

  renderer.dispose();
  renderer.domElement.remove();
  renderer=null;
 }

 scene=null;
 camera=null;
 player=null;
 bots=[];
 obstacles=[];
}

function resize(){

 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
}

window.addEventListener('resize',resize);

document.addEventListener('keydown',e=>{

 keys[e.key.toLowerCase()]=true;

 if(e.key===' ')jump();
 if(e.key.toLowerCase()==='r')reload();
 if(e.key==='Escape')pauseGame();

 if(e.key==='Shift')sprinting=true;
});

document.addEventListener('keyup',e=>{

 keys[e.key.toLowerCase()]=false;

 if(e.key==='Shift')sprinting=false;
});

function keyboard(){

 if(!running||paused)return;

 const x=(keys.d?1:0)-(keys.a?1:0);
 const y=(keys.w?1:0)-(keys.s?1:0);

 if(stickPointer===null){

  moveX=x;
  moveY=y;
 }

 if(keys.shift)sprinting=true;
}

setInterval(keyboard,40);

$('stick').addEventListener('pointerdown',e=>{

 stickPointer=e.pointerId;

 $('stick').setPointerCapture(e.pointerId);

 moveStick(e);
});

$('stick').addEventListener('pointermove',e=>{

 if(e.pointerId===stickPointer)moveStick(e);
});

function moveStick(e){

 const r=$('stick').getBoundingClientRect();

 moveX=THREE.MathUtils.clamp(
  (e.clientX-r.left-r.width/2)/45,-1,1
 );

 moveY=THREE.MathUtils.clamp(
  (e.clientY-r.top-r.height/2)/45,-1,1
 );

 $('knob').style.transform=
  `translate(${moveX*35}px,${moveY*35}px)`;
}

function stopStick(e){

 if(e.pointerId!==stickPointer)return;

 stickPointer=null;

 moveX=0;
 moveY=0;

 $('knob').style.transform='';
}

$('stick').addEventListener('pointerup',stopStick);
$('stick').addEventListener('pointercancel',stopStick);

$('look').addEventListener('pointerdown',e=>{

 lookPointer=e.pointerId;

 $('look').setPointerCapture(e.pointerId);

 $('look').dataset.x=e.clientX;
 $('look').dataset.y=e.clientY;
});

$('look').addEventListener('pointermove',e=>{

 if(e.pointerId!==lookPointer)return;

 const dx=e.clientX-Number($('look').dataset.x);
 const dy=e.clientY-Number($('look').dataset.y);

 yaw-=dx*.005;

 pitch=THREE.MathUtils.clamp(
  pitch-dy*.005,-1.3,1.3
 );

 $('look').dataset.x=e.clientX;
 $('look').dataset.y=e.clientY;
});

function stopLook(e){

 if(e.pointerId===lookPointer)lookPointer=null;
}

$('look').addEventListener('pointerup',stopLook);
$('look').addEventListener('pointercancel',stopLook);

$('fire').addEventListener('pointerdown',e=>{
 e.preventDefault();
 shoot();
});

$('reload').addEventListener('pointerdown',e=>{
 e.preventDefault();
 reload();
});

$('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 jump();
});

$('sprint').addEventListener('pointerdown',e=>{
 e.preventDefault();
 sprinting=true;
});

$('sprint').addEventListener('pointerup',()=>{
 sprinting=false;
});

$('sprint').addEventListener('pointercancel',()=>{
 sprinting=false;
});

$('aim').addEventListener('pointerdown',()=>{

 if(!running||paused)return;

 aiming=!aiming;

 camera.fov=aiming?55:75;
 camera.updateProjectionMatrix();
